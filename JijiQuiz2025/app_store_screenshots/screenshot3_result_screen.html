<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025時事クイズ - 結果画面</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 1242px;
            height: 2688px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .phone-mockup {
            position: absolute;
            right: 80px;
            top: 200px;
            width: 400px;
            height: 800px;
            background: #000;
            border-radius: 50px;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
        }

        .screen {
            width: 100%;
            height: 100%;
            background: #f8fafc;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }

        .result-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 20px 30px;
            text-align: center;
        }

        .header-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .header-subtitle {
            font-size: 16px;
            opacity: 0.9;
        }

        .result-content {
            padding: 40px 20px;
            text-align: center;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border: 8px solid #e2e8f0;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
            position: relative;
        }

        .score-circle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            width: 150px;
            height: 150px;
            border: 8px solid transparent;
            border-top: 8px solid #4ade80;
            border-radius: 50%;
            transform: rotate(-90deg);
        }

        .score-number {
            font-size: 48px;
            font-weight: bold;
            color: #1e293b;
        }

        .score-total {
            font-size: 18px;
            color: #64748b;
        }

        .percentage {
            font-size: 24px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 20px;
        }

        .message {
            font-size: 18px;
            color: #1e293b;
            margin-bottom: 30px;
        }

        .badge {
            background: rgba(34, 197, 94, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .badge-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .badge-text {
            font-size: 18px;
            font-weight: 600;
            color: #16a34a;
        }

        .home-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
        }

        .left-content {
            flex: 1;
            padding: 100px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-title {
            font-size: 72px;
            font-weight: 900;
            color: white;
            margin-bottom: 30px;
            line-height: 1.2;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .description {
            font-size: 32px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            line-height: 1.4;
        }

        .achievement-list {
            list-style: none;
            padding: 0;
        }

        .achievement-list li {
            font-size: 24px;
            color: white;
            margin-bottom: 20px;
            padding-left: 40px;
            position: relative;
        }

        .achievement-list li::before {
            content: "🏆";
            position: absolute;
            left: 0;
            font-size: 28px;
        }

        .decorative-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle {
            position: absolute;
            color: rgba(255,255,255,0.6);
            font-size: 30px;
            animation: sparkle 3s ease-in-out infinite;
        }

        .sparkle1 { top: 20%; left: 15%; animation-delay: 0s; }
        .sparkle2 { top: 40%; left: 5%; animation-delay: 1s; }
        .sparkle3 { bottom: 30%; left: 20%; animation-delay: 2s; }
        .sparkle4 { top: 70%; left: 10%; animation-delay: 1.5s; }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="decorative-elements">
        <div class="sparkle sparkle1">✨</div>
        <div class="sparkle sparkle2">⭐</div>
        <div class="sparkle sparkle3">✨</div>
        <div class="sparkle sparkle4">⭐</div>
    </div>

    <div class="left-content">
        <div class="main-title">結果を<br>確認</div>
        <div class="description">学習の成果を<br>可視化して達成感を</div>
        
        <ul class="achievement-list">
            <li>正答率をパーセントで表示</li>
            <li>達成度に応じたメッセージ</li>
            <li>継続学習をサポート</li>
            <li>月別で成長を実感</li>
        </ul>
    </div>

    <div class="phone-mockup">
        <div class="screen">
            <div class="result-header">
                <div class="header-title">結果発表</div>
                <div class="header-subtitle">お疲れ様でした！</div>
            </div>
            
            <div class="result-content">
                <div>
                    <div class="score-circle">
                        <div class="score-number">8</div>
                        <div class="score-total">/ 10</div>
                    </div>
                    
                    <div class="percentage">正答率: 80%</div>
                    <div class="message">素晴らしい！時事問題に詳しいですね！</div>
                    
                    <div class="badge">
                        <div class="badge-icon">⭐</div>
                        <div class="badge-text">優秀！</div>
                    </div>
                </div>
                
                <button class="home-button">最初に戻る</button>
            </div>
        </div>
    </div>
</body>
</html>
